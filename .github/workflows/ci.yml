name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pytest>=7,<9"
      - name: Run tests
        run: python -m pytest -q
      - name: Compile Python sources
        run: python -m compileall -q app server.py tests
      - name: Check dashboard JavaScript syntax
        run: node --check app/web/static/dashboard.js

  android:
    name: Android unit tests and debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Run Android unit tests and assemble debug APK
        working-directory: PhoneCamSender
        run: ./gradlew testDebugUnitTest assembleDebug --no-daemon
      - name: Verify debug APK exists
        run: test -s PhoneCamSender/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable debug APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: camflow-phonecam-debug-apk
          path: PhoneCamSender/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3
